<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Picker – Mobile Device Catalog</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#1b2033; --muted:#5d6580; --accent:#4f46e5; --accent-d:#3730a3; --ok:#0f8a4f; --line:#dde1ee; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; padding:1.5rem 1rem; }
  header h1 { margin:0 0 .25rem; font-size:1.6rem; }
  header p { margin:0; opacity:.9; }
  main { max-width:1200px; margin:0 auto; padding:1rem; display:grid; gap:1rem; grid-template-columns:1fr 300px; align-items:start; }
  .filters { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:.75rem; background:var(--card); padding:1rem; border-radius:12px; border:1px solid var(--line); }
  .filters label { display:flex; flex-direction:column; font-size:.8rem; color:var(--muted); gap:.25rem; flex:1 1 180px; }
  input, select, button { font:inherit; }
  input, select { padding:.55rem .7rem; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  :focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:1rem; list-style:none; margin:0; padding:0; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:1rem; display:flex; flex-direction:column; gap:.5rem; }
  .card.selected { border-color:var(--accent); box-shadow:0 0 0 3px rgba(79,70,229,.2); }
  .card img { width:100%; height:160px; object-fit:contain; border-radius:8px; background:#eef0f8; }
  .card h3 { margin:0; font-size:1.05rem; }
  .meta { color:var(--muted); font-size:.85rem; }
  .price { font-weight:700; font-size:1.1rem; }
  .btn { padding:.6rem .9rem; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .btn:hover:not(:disabled) { background:var(--accent-d); }
  .btn:disabled { background:#aab; cursor:not-allowed; }
  .btn.secondary { background:#fff; color:var(--accent); border:2px solid var(--accent); }
  .card .btn { margin-top:auto; }
  aside { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; position:sticky; top:1rem; }
  aside h2 { margin-top:0; font-size:1.15rem; }
  aside img { width:100%; height:140px; object-fit:contain; background:#eef0f8; border-radius:8px; }
  fieldset { border:0; padding:0; margin:.75rem 0; }
  legend { font-size:.85rem; color:var(--muted); margin-bottom:.35rem; padding:0; }
  .opts { display:flex; flex-wrap:wrap; gap:.4rem; }
  .opts label { cursor:pointer; }
  .opts input { position:absolute; opacity:0; }
  .opts span { display:inline-block; padding:.4rem .7rem; border:2px solid var(--line); border-radius:8px; font-size:.9rem; }
  .opts input:checked + span { border-color:var(--accent); background:#eef; font-weight:600; }
  .opts input:focus-visible + span { outline:3px solid #f59e0b; outline-offset:2px; }
  .status { min-height:1.4rem; color:var(--ok); font-weight:600; margin:.5rem 0 0; }
  .empty { padding:2rem; text-align:center; color:var(--muted); }
  .basket-count { display:inline-grid; place-items:center; min-width:1.5rem; height:1.5rem; margin-left:.25rem; border-radius:99px; background:#fff; color:var(--accent-d); }
  @media (max-width:800px) { main { grid-template-columns:1fr; } aside { position:static; order:-1; } }
</style>
</head>
<body>
<header>
  <h1>Phone Picker</h1>
  <p>Browse the catalog, choose a storage size and continue with your device.</p>
</header>
<main>
  <section class="filters" aria-label="Search and filters">
    <label>Search<input id="search" type="search" placeholder="e.g. Pixel, iPhone" autocomplete="off"></label>
    <label>Brand<select id="brand"><option value="">All brands</option></select></label>
    <label>Category<select id="category"><option value="">All categories</option></select></label>
    <label>Sort<select id="sort">
      <option value="">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option>
    </select></label>
  </section>

  <section aria-labelledby="catalog-h">
    <h2 id="catalog-h" style="margin-top:0">Catalog <span class="meta" id="count" aria-live="polite"></span></h2>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>No devices match your search.</p>
  </section>

  <aside aria-labelledby="sel-h">
    <h2 id="sel-h">Your selection</h2>
    <div id="none" class="meta">No device selected yet. Choose “Select” on a phone.</div>
    <div id="detail" hidden>
      <img id="sel-img" alt="">
      <h3 id="sel-name" style="margin:.5rem 0 0"></h3>
      <div class="meta" id="sel-meta"></div>
      <fieldset><legend>Storage</legend><div class="opts" id="storage"></div></fieldset>
      <div class="price" id="sel-price"></div>
      <p><button class="btn" id="add" type="button">Add to cart</button></p>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </aside>
</main>

<script>
(function () {
  'use strict';
  var CATALOG = [
    { id:'iphone15', brand:'Apple', name:'iPhone 15', category:'Flagship', base:799, opts:[[128,0],[256,100],[512,300]], color:'#4f46e5', img:'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/IPhone_15_Pro_Max_Blue_Titanium.jpg/240px-IPhone_15_Pro_Max_Blue_Titanium.jpg' },
    { id:'iphone15pro', brand:'Apple', name:'iPhone 15 Pro', category:'Flagship', base:999, opts:[[128,0],[256,100],[512,300],[1024,500]], color:'#334155' },
    { id:'iphonese', brand:'Apple', name:'iPhone SE (3rd gen)', category:'Budget', base:429, opts:[[64,0],[128,50],[256,150]], color:'#dc2626' },
    { id:'s24', brand:'Samsung', name:'Galaxy S24', category:'Flagship', base:799, opts:[[128,0],[256,60],[512,180]], color:'#7c3aed' },
    { id:'s24u', brand:'Samsung', name:'Galaxy S24 Ultra', category:'Flagship', base:1299, opts:[[256,0],[512,120],[1024,360]], color:'#0f766e' },
    { id:'a54', brand:'Samsung', name:'Galaxy A54 5G', category:'Mid-range', base:449, opts:[[128,0],[256,50]], color:'#2563eb' },
    { id:'zflip5', brand:'Samsung', name:'Galaxy Z Flip5', category:'Foldable', base:999, opts:[[256,0],[512,120]], color:'#db2777' },
    { id:'pixel8', brand:'Google', name:'Pixel 8', category:'Flagship', base:699, opts:[[128,0],[256,60]], color:'#16a34a' },
    { id:'pixel8a', brand:'Google', name:'Pixel 8a', category:'Mid-range', base:499, opts:[[128,0],[256,60]], color:'#ea580c' },
    { id:'fold', brand:'Google', name:'Pixel Fold', category:'Foldable', base:1799, opts:[[256,0],[512,100]], color:'#0891b2' },
    { id:'nord3', brand:'OnePlus', name:'OnePlus Nord 3', category:'Mid-range', base:399, opts:[[128,0],[256,50]], color:'#be123c' },
    { id:'op12', brand:'OnePlus', name:'OnePlus 12', category:'Flagship', base:799, opts:[[256,0],[512,100]], color:'#15803d' },
    { id:'redmi', brand:'Xiaomi', name:'Redmi Note 13', category:'Budget', base:199, opts:[[128,0],[256,40]], color:'#d97706' },
    { id:'x14', brand:'Xiaomi', name:'Xiaomi 14', category:'Flagship', base:899, opts:[[256,0],[512,100]], color:'#475569' }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var state = { query:'', brand:'', category:'', sort:'', selectedId:null, storage:null };
  var cart = [];

  function fmt(n) { return '$' + n.toLocaleString('en-US'); }
  function size(gb) { return gb >= 1024 ? (gb / 1024) + ' TB' : gb + ' GB'; }
  function find(id) { return CATALOG.filter(function (d) { return d.id === id; })[0]; }
  function priceFor(d, gb) {
    var o = d.opts.filter(function (x) { return x[0] === gb; })[0];
    return d.base + (o ? o[1] : 0);
  }
  function placeholder(d) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">' +
      '<rect width="240" height="160" fill="#eef0f8"/><rect x="85" y="10" width="70" height="140" rx="14" fill="' + d.color + '"/>' +
      '<rect x="91" y="20" width="58" height="120" rx="8" fill="#fff" opacity=".25"/><circle cx="120" cy="143" r="3" fill="#fff"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  function imgSrc(d) { return d.img || placeholder(d); }
  function attachFallback(img, d) {
    img.onerror = function () { img.onerror = null; img.src = placeholder(d); };
  }
  function uniq(key) {
    return CATALOG.map(function (d) { return d[key]; })
      .filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
  }
  function fill(sel, values) {
    values.forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }

  function filtered() {
    var q = state.query.trim().toLowerCase();
    var list = CATALOG.filter(function (d) {
      return (!state.brand || d.brand === state.brand) &&
        (!state.category || d.category === state.category) &&
        (!q || (d.brand + ' ' + d.name + ' ' + d.category).toLowerCase().indexOf(q) !== -1);
    });
    if (state.sort) {
      list.sort(function (a, b) { return state.sort === 'asc' ? a.base - b.base : b.base - a.base; });
    }
    return list;
  }

  function renderGrid() {
    var list = filtered(), grid = $('grid');
    grid.innerHTML = '';
    list.forEach(function (d) {
      var li = document.createElement('li');
      li.className = 'card' + (d.id === state.selectedId ? ' selected' : '');
      var img = document.createElement('img');
      img.alt = d.brand + ' ' + d.name; img.loading = 'lazy'; img.src = imgSrc(d);
      attachFallback(img, d);
      var h = document.createElement('h3'); h.textContent = d.name;
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = d.brand + ' · ' + d.category + ' · ' + d.opts.map(function (o) { return size(o[0]); }).join(' / ');
      var p = document.createElement('div'); p.className = 'price'; p.textContent = 'From ' + fmt(d.base);
      var b = document.createElement('button');
      var isSel = d.id === state.selectedId;
      b.type = 'button'; b.className = 'btn' + (isSel ? '' : ' secondary');
      b.textContent = isSel ? '✓ Selected' : 'Select';
      b.setAttribute('aria-pressed', String(isSel));
      b.setAttribute('aria-label', (isSel ? 'Selected: ' : 'Select ') + d.name);
      b.addEventListener('click', function () { selectDevice(d.id); });
      [img, h, m, p, b].forEach(function (n) { li.appendChild(n); });
      grid.appendChild(li);
    });
    $('empty').hidden = list.length > 0;
    $('count').textContent = '(' + list.length + ' of ' + CATALOG.length + ')';
  }

  function renderSelection() {
    var d = state.selectedId && find(state.selectedId);
    $('none').hidden = !!d; $('detail').hidden = !d;
    if (!d) { return; }
    var img = $('sel-img'); img.alt = d.brand + ' ' + d.name; attachFallback(img, d); img.src = imgSrc(d);
    $('sel-name').textContent = d.name;
    $('sel-meta').textContent = d.brand + ' · ' + d.category;
    var box = $('storage'); box.innerHTML = '';
    d.opts.forEach(function (o) {
      var l = document.createElement('label'), r = document.createElement('input'), s = document.createElement('span');
      r.type = 'radio'; r.name = 'storage'; r.value = o[0]; r.checked = o[0] === state.storage;
      r.addEventListener('change', function () {
        state.storage = o[0]; $('status').textContent = ''; renderSelection();
      });
      s.textContent = size(o[0]) + ' – ' + fmt(d.base + o[1]);
      l.appendChild(r); l.appendChild(s); box.appendChild(l);
    });
    $('sel-price').textContent = fmt(priceFor(d, state.storage));
  }

  function selectDevice(id) {
    state.selectedId = state.selectedId === id ? null : id;
    var device = state.selectedId && find(state.selectedId);
    state.storage = device ? device.opts[0][0] : null;
    $('status').textContent = '';
    renderGrid();
    renderSelection();
  }

  $('add').addEventListener('click', function () {
    var d = find(state.selectedId);
    if (!d) { return; }
    var price = priceFor(d, state.storage);
    cart.push({ deviceId:d.id, storage:state.storage, price:price });
    $('cartCount').textContent = String(cart.length);
    $('cartButton').setAttribute('aria-label', 'Shopping cart, ' + cart.length + (cart.length === 1 ? ' item' : ' items'));
    $('status').textContent = '✓ Added to cart: ' + d.name + ', ' + size(state.storage) + ' – ' + fmt(price);
  });
  $('search').addEventListener('input', function (e) { state.query = e.target.value; renderGrid(); });
  $('brand').addEventListener('change', function (e) { state.brand = e.target.value; renderGrid(); });
  $('category').addEventListener('change', function (e) { state.category = e.target.value; renderGrid(); });
  $('sort').addEventListener('change', function (e) { state.sort = e.target.value; renderGrid(); });

  fill($('brand'), uniq('brand'));
  fill($('category'), uniq('category'));
  renderGrid(); renderSelection();
})();
</script>
</body>
</html>
