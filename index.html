<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MobileDeviceStore</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #68738a;
      --line: #e4e8f0;
      --surface: #ffffff;
      --background: #f6f8fc;
      --brand: #3156d3;
      --brand-dark: #2443ac;
      --accent: #e9efff;
      --success: #147d52;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--background);
      font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1180px; margin: auto; padding: 28px 20px 52px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 36px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.25rem; font-weight: 800; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: white; background: var(--brand); box-shadow: 0 8px 18px #3156d33b; }
    .basket { border: 0; border-radius: 10px; padding: 10px 15px; color: var(--brand-dark); background: var(--accent); font-weight: 700; }
    .hero { display: grid; grid-template-columns: 1.3fr .7fr; align-items: end; gap: 30px; margin-bottom: 28px; }
    h1 { max-width: 650px; margin: 0 0 10px; font-size: clamp(2.2rem, 5vw, 4rem); line-height: 1.05; letter-spacing: -.06em; }
    .intro { max-width: 580px; margin: 0; color: var(--muted); font-size: 1.08rem; }
    .stats { display: flex; justify-content: flex-end; gap: 28px; color: var(--muted); text-align: right; }
    .stats strong { display: block; color: var(--ink); font-size: 1.7rem; }
    .toolbar { display: grid; grid-template-columns: minmax(180px, 1fr) 170px 170px; gap: 12px; margin-bottom: 24px; }
    .control { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; color: var(--ink); background: var(--surface); outline: none; }
    .control:focus { border-color: var(--brand); box-shadow: 0 0 0 3px #3156d31f; }
    .catalog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { display: flex; flex-direction: column; min-height: 390px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--surface); box-shadow: 0 6px 20px #1720330a; transition: transform .18s, box-shadow .18s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px #17203314; }
    .visual { display: grid; place-items: center; height: 170px; margin-bottom: 16px; border-radius: 12px; background: linear-gradient(145deg, #eef2ff, #f8faff); }
    .phone { display: grid; place-items: center; width: 76px; height: 135px; border: 4px solid #202b45; border-radius: 15px; color: white; background: var(--phone-color, #6b7cd8); box-shadow: 10px 12px 0 #202b4514; font-size: 2rem; }
    .phone::after { content: ''; position: absolute; width: 22px; height: 4px; margin-top: -116px; border-radius: 5px; background: #202b45; }
    .tag { align-self: flex-start; margin-bottom: 8px; border-radius: 99px; padding: 4px 9px; color: var(--brand-dark); background: var(--accent); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .card h2 { margin: 0; font-size: 1.2rem; letter-spacing: -.02em; }
    .specs { display: flex; gap: 8px; margin: 7px 0 16px; color: var(--muted); font-size: .9rem; }
    .price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: auto; }
    .price { font-size: 1.35rem; font-weight: 800; }
    .stock { color: var(--success); font-size: .8rem; font-weight: 700; }
    .select-button { width: 100%; margin-top: 14px; border: 0; border-radius: 9px; padding: 11px; color: white; background: var(--brand); font-weight: 700; }
    .select-button:hover { background: var(--brand-dark); }
    .select-button.selected { color: var(--brand-dark); background: #dce5ff; }
    .empty { grid-column: 1 / -1; padding: 50px 20px; border: 1px dashed #cbd2e0; border-radius: 14px; color: var(--muted); text-align: center; }
    .selection { display: none; margin-top: 25px; border-radius: 14px; padding: 16px 18px; color: var(--brand-dark); background: var(--accent); }
    .selection.visible { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .selection p { margin: 0; }
    .clear { border: 1px solid #b9c9fa; border-radius: 8px; padding: 8px 12px; color: var(--brand-dark); background: transparent; font-weight: 700; }
    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; }
      .stats { justify-content: flex-start; text-align: left; }
      .toolbar, .catalog { grid-template-columns: 1fr; }
      .selection.visible { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><span class="brand-mark" aria-hidden="true">⌁</span> MobileDeviceStore</div>
      <button class="basket" type="button" id="selectionButton">Selected: 0</button>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Find your next device.</h1>
        <p class="intro">Compare popular phones in one place and select the model that fits your everyday life.</p>
      </div>
      <div class="stats" aria-label="Catalog summary"><div><strong id="deviceCount">6</strong>devices</div><div><strong>Free</strong>delivery</div></div>
    </section>

    <section class="toolbar" aria-label="Catalog controls">
      <label><span class="sr-only">Search devices</span><input class="control" id="search" type="search" placeholder="Search by brand or model..."></label>
      <label><span class="sr-only">Filter by category</span><select class="control" id="category"><option value="all">All categories</option><option value="flagship">Flagship</option><option value="midrange">Mid-range</option><option value="budget">Budget</option></select></label>
      <label><span class="sr-only">Sort devices</span><select class="control" id="sort"><option value="featured">Featured</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="rating">Top rated</option></select></label>
    </section>

    <section class="catalog" id="catalog" aria-live="polite"></section>
    <aside class="selection" id="selectionSummary" aria-live="polite"><p><strong id="selectedName">No device selected</strong><br><span id="selectedDetails">Choose a device to add it to your selection.</span></p><button class="clear" id="clearSelection" type="button">Clear selection</button></aside>
  </main>

  <script>
    const devices = [
      { id: 1, brand: 'Aster', model: 'Pro X1', category: 'flagship', price: 999, rating: 4.9, memory: '256GB', color: '#596bd0', badge: 'Best seller' },
      { id: 2, brand: 'Nova', model: 'Ultra 12', category: 'flagship', price: 899, rating: 4.8, memory: '256GB', color: '#b04e74', badge: 'New' },
      { id: 3, brand: 'Pixelia', model: 'Note 5', category: 'midrange', price: 599, rating: 4.6, memory: '128GB', color: '#e1934f', badge: 'Great value' },
      { id: 4, brand: 'Aster', model: 'Lite 3', category: 'budget', price: 349, rating: 4.4, memory: '128GB', color: '#3e9b91', badge: 'Popular' },
      { id: 5, brand: 'Orbit', model: 'Max 8', category: 'midrange', price: 649, rating: 4.7, memory: '256GB', color: '#7658ac', badge: 'Long battery' },
      { id: 6, brand: 'Nova', model: 'Go 2', category: 'budget', price: 249, rating: 4.2, memory: '64GB', color: '#4383a9', badge: 'Everyday pick' }
    ];
    let selectedId = null;
    const catalog = document.querySelector('#catalog');
    const search = document.querySelector('#search');
    const category = document.querySelector('#category');
    const sort = document.querySelector('#sort');

    function formatPrice(price) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(price); }
    function visibleDevices() {
      const term = search.value.trim().toLowerCase();
      const result = devices.filter(device => {
        const matchesTerm = `${device.brand} ${device.model}`.toLowerCase().includes(term);
        return matchesTerm && (category.value === 'all' || device.category === category.value);
      });
      return result.sort((a, b) => sort.value === 'price-low' ? a.price - b.price : sort.value === 'price-high' ? b.price - a.price : sort.value === 'rating' ? b.rating - a.rating : a.id - b.id);
    }
    function render() {
      const items = visibleDevices();
      document.querySelector('#deviceCount').textContent = items.length;
      catalog.innerHTML = items.length ? items.map(device => `
        <article class="card">
          <div class="visual"><div class="phone" style="--phone-color:${device.color}" aria-hidden="true">✦</div></div>
          <span class="tag">${device.badge}</span>
          <h2>${device.brand} ${device.model}</h2>
          <div class="specs"><span>${device.memory}</span><span>•</span><span>★ ${device.rating}</span></div>
          <div class="price-row"><span class="price">${formatPrice(device.price)}</span><span class="stock">In stock</span></div>
          <button class="select-button ${selectedId === device.id ? 'selected' : ''}" type="button" data-id="${device.id}">${selectedId === device.id ? 'Selected' : 'Select device'}</button>
        </article>`).join('') : '<p class="empty">No devices match your search. Try another brand or category.</p>';
      catalog.querySelectorAll('[data-id]').forEach(button => button.addEventListener('click', () => selectDevice(Number(button.dataset.id))));
    }
    function selectDevice(id) {
      selectedId = selectedId === id ? null : id;
      const device = devices.find(item => item.id === selectedId);
      document.querySelector('#selectionButton').textContent = `Selected: ${device ? 1 : 0}`;
      document.querySelector('#selectionSummary').classList.toggle('visible', Boolean(device));
      if (device) {
        document.querySelector('#selectedName').textContent = `${device.brand} ${device.model} selected`;
        document.querySelector('#selectedDetails').textContent = `${formatPrice(device.price)} • ${device.memory} • ★ ${device.rating}`;
      }
      render();
    }
    [search, category, sort].forEach(control => control.addEventListener('input', render));
    document.querySelector('#clearSelection').addEventListener('click', () => selectDevice(selectedId));
    render();
  </script>
</body>
</html>
