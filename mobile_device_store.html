<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f5">
  <title>Mobile Device Store</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17211d;
      background: #f6f7f5;
      --muted: #68746e;
      --line: #e1e7e2;
      --green: #176b4a;
      --green-dark: #10543a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select { font: inherit; }
    button, select, input[type="checkbox"] { cursor: pointer; }
    .site-header { display: flex; align-items: center; justify-content: space-between; min-height: 68px; padding: 0 clamp(20px, 6vw, 88px); background: #fff; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 750; letter-spacing: -.04em; }
    .brand-icon { display: grid; width: 34px; height: 34px; place-items: center; color: #fff; background: var(--green); border-radius: 10px; }
    .header-note { color: var(--muted); font-size: 13px; }
    main { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 72px; }
    .intro { max-width: 680px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(36px, 5vw, 56px); line-height: 1.05; letter-spacing: -.055em; }
    .intro p:last-child { color: var(--muted); line-height: 1.6; }
    .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px; align-items: start; }
    .filters, .card, .selection { background: #fff; border: 1px solid var(--line); border-radius: 14px; }
    .filters { padding: 20px 16px; }
    .filters h2 { margin: 0 0 14px; font-size: 15px; }
    .categories { display: grid; gap: 4px; }
    .category { padding: 9px 10px; color: #46534b; background: transparent; border: 0; border-radius: 8px; text-align: left; }
    .category:hover, .category[aria-pressed="true"] { color: var(--green-dark); background: #eaf4ee; }
    .category[aria-pressed="true"] { font-weight: 700; }
    .filter-divider { height: 1px; margin: 18px 0; background: var(--line); }
    .field { display: block; margin: 0 0 14px; font-size: 12px; font-weight: 700; }
    .field select, .search { display: block; width: 100%; min-height: 42px; margin-top: 7px; padding: 8px 10px; color: #25322b; background: #fff; border: 1px solid #d5ded7; border-radius: 8px; }
    .field select:focus, .search:focus, button:focus-visible, input:focus-visible { outline: 3px solid #176b4a55; outline-offset: 2px; }
    .selection { margin-top: 20px; padding: 15px; background: #f4f7f4; }
    .selection h2 { margin: 0; font-size: 14px; }
    .selection p { margin: 8px 0; color: var(--muted); font-size: 13px; }
    .total { color: #17211d !important; font-weight: 750; }
    .primary, .secondary { width: 100%; min-height: 42px; border-radius: 8px; font-weight: 700; }
    .primary { color: #fff; background: var(--green); border: 0; }
    .primary:hover:not(:disabled) { background: var(--green-dark); }
    .secondary { margin-top: 8px; color: var(--muted); background: transparent; border: 1px solid #cbd6ce; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .toolbar { display: grid; grid-template-columns: minmax(160px, 1fr) 190px; gap: 12px; margin-bottom: 14px; }
    .search { min-height: 44px; margin: 0; }
    .sort { min-height: 44px; padding: 8px 10px; background: #fff; border: 1px solid #d5ded7; border-radius: 8px; }
    .results { min-height: 22px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { overflow: hidden; }
    .art { display: grid; height: 150px; place-items: center; background: var(--art); }
    .device { position: relative; width: 68px; height: 120px; border: 5px solid #26352d; border-radius: 15px; background: linear-gradient(145deg, var(--light), var(--dark)); box-shadow: 0 10px 18px #17211d30; }
    .device::after { position: absolute; top: 4px; left: 50%; width: 18px; height: 4px; background: #26352d; border-radius: 4px; content: ""; transform: translateX(-50%); }
    .device.tablet { width: 105px; height: 125px; border-radius: 12px; }
    .device.tablet::after { top: 50%; left: auto; right: 3px; width: 4px; height: 4px; transform: none; }
    .card-content { padding: 14px; }
    .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 11px; }
    .brand-name { font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .stock { color: var(--green); font-weight: 700; }
    .card h3 { margin: 10px 0 4px; font-size: 16px; }
    .spec { margin: 0; color: var(--muted); font-size: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #edf0ed; }
    .price { font-size: 17px; font-weight: 750; }
    .check-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; }
    .check-label input { width: 17px; height: 17px; accent-color: var(--green); }
    .empty { grid-column: 1 / -1; padding: 42px 18px; color: var(--muted); background: #fff; border: 1px dashed #cbd6ce; border-radius: 12px; text-align: center; }
    .empty strong { display: block; margin-bottom: 6px; color: #25322b; }
    .notice { margin-top: 12px; color: var(--green-dark); font-size: 13px; }
    @media (max-width: 950px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 700px) { .header-note { display: none; } main { padding-top: 34px; } .layout { grid-template-columns: 1fr; gap: 18px; } .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .filters h2, .categories { grid-column: 1 / -1; } .categories { grid-template-columns: repeat(3, 1fr); } .category { text-align: center; } .filter-divider { display: none; } .selection { grid-column: 1 / -1; margin: 0; } .field { margin: 0; } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .toolbar { grid-template-columns: 1fr; } .site-header { padding: 0 20px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand"><span class="brand-icon" aria-hidden="true">M</span><span>mobile<span style="color:var(--green)">store</span></span></div>
    <span class="header-note">Thoughtful tech, made simple.</span>
  </header>
  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">The device catalog</p>
      <h1 id="page-title">Find your next device.</h1>
      <p>Explore phones and tablets, compare their details, and select the devices you are interested in.</p>
    </section>
    <div class="layout">
      <aside class="filters" aria-label="Catalog filters">
        <h2>Browse devices</h2>
        <div class="categories" role="group" aria-label="Device type">
          <button class="category" type="button" data-category="all" aria-pressed="true">All devices</button>
          <button class="category" type="button" data-category="phone" aria-pressed="false">Phones</button>
          <button class="category" type="button" data-category="tablet" aria-pressed="false">Tablets</button>
        </div>
        <div class="filter-divider"></div>
        <label class="field" for="brand-filter">Brand
          <select id="brand-filter"><option value="all">All brands</option></select>
        </label>
        <label class="field" for="sort-select">Sort by
          <select id="sort-select">
            <option value="featured">Featured</option>
            <option value="price-low">Price: low to high</option>
            <option value="price-high">Price: high to low</option>
            <option value="name">Name: A to Z</option>
          </select>
        </label>
        <section class="selection" aria-labelledby="selection-title">
          <h2 id="selection-title">Your selection</h2>
          <p id="selection-count" aria-live="polite">No devices selected</p>
          <p class="total" id="selection-total">Total: $0</p>
          <button class="primary" id="review-button" type="button" disabled>Review selection</button>
          <button class="secondary" id="clear-button" type="button" disabled>Clear selection</button>
          <p class="notice" id="selection-notice" role="status" hidden></p>
        </section>
      </aside>
      <section aria-label="Mobile device catalog">
        <div class="toolbar">
          <label class="field" for="search-input" style="margin:0"><span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Search devices</span><input class="search" id="search-input" type="search" placeholder="Search by device or brand" autocomplete="off"></label>
          <label class="field" for="catalog-sort" style="margin:0">Sort
            <select class="sort" id="catalog-sort">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </label>
        </div>
        <p class="results" id="results" aria-live="polite"></p>
        <div class="grid" id="product-grid"></div>
      </section>
    </div>
  </main>
  <script>
    const devices = [
      { id: "iphone-16", name: "iPhone 16", brand: "Apple", category: "phone", detail: "128 GB · 6.1-inch display", price: 799, colors: ["#d9eee3", "#77a98a"], art: "#edf5ef" },
      { id: "galaxy-s25", name: "Galaxy S25", brand: "Samsung", category: "phone", detail: "256 GB · 6.2-inch display", price: 859, colors: ["#e5e6f4", "#8588be"], art: "#f0f0f8" },
      { id: "pixel-9", name: "Pixel 9", brand: "Google", category: "phone", detail: "128 GB · 6.3-inch display", price: 699, colors: ["#f1e4d7", "#bd8c68"], art: "#f8f1eb" },
      { id: "iphone-16-pro", name: "iPhone 16 Pro", brand: "Apple", category: "phone", detail: "256 GB · 6.3-inch display", price: 999, colors: ["#e7e5df", "#9b978b"], art: "#f2f1ed" },
      { id: "galaxy-tab-s10", name: "Galaxy Tab S10", brand: "Samsung", category: "tablet", detail: "256 GB · 12.4-inch display", price: 999, colors: ["#dce8f1", "#7994ad"], art: "#edf3f7" },
      { id: "ipad-air", name: "iPad Air", brand: "Apple", category: "tablet", detail: "128 GB · 11-inch display", price: 599, colors: ["#f1dfd9", "#bd8878"], art: "#f7efec" },
      { id: "pixel-tablet", name: "Pixel Tablet", brand: "Google", category: "tablet", detail: "128 GB · 11-inch display", price: 399, colors: ["#e4e8d8", "#8b9b70"], art: "#f0f3eb" },
      { id: "oneplus-13", name: "OnePlus 13", brand: "OnePlus", category: "phone", detail: "256 GB · 6.8-inch display", price: 899, colors: ["#e8ddd7", "#ad8171"], art: "#f3ece8" }
    ];
    const currency = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
    const grid = document.querySelector("#product-grid");
    const results = document.querySelector("#results");
    const search = document.querySelector("#search-input");
    const brandFilter = document.querySelector("#brand-filter");
    const sortSelect = document.querySelector("#catalog-sort");
    const countLabel = document.querySelector("#selection-count");
    const totalLabel = document.querySelector("#selection-total");
    const reviewButton = document.querySelector("#review-button");
    const clearButton = document.querySelector("#clear-button");
    const notice = document.querySelector("#selection-notice");
    const selected = new Set();
    let category = "all";

    for (const brand of [...new Set(devices.map(device => device.brand))].sort()) {
      const option = document.createElement("option");
      option.value = brand;
      option.textContent = brand;
      brandFilter.append(option);
    }
    document.querySelectorAll(".category").forEach(button => {
      button.addEventListener("click", () => {
        category = button.dataset.category;
        document.querySelectorAll(".category").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        render();
      });
    });
    [search, brandFilter, sortSelect].forEach(control => control.addEventListener(control === search ? "input" : "change", render));
    grid.addEventListener("change", event => {
      if (!event.target.matches(".device-checkbox")) return;
      if (event.target.checked) selected.add(event.target.value);
      else selected.delete(event.target.value);
      updateSelection();
    });
    clearButton.addEventListener("click", () => { selected.clear(); notice.hidden = true; updateSelection(); });
    reviewButton.addEventListener("click", () => {
      const chosen = devices.filter(device => selected.has(device.id));
      notice.textContent = `Selected: ${chosen.map(device => device.name).join(", ")} — ${currency.format(chosen.reduce((sum, device) => sum + device.price, 0))}`;
      notice.hidden = false;
    });
    function getVisibleDevices() {
      const query = search.value.trim().toLowerCase();
      const matches = devices.filter(device => (category === "all" || device.category === category)
        && (brandFilter.value === "all" || device.brand === brandFilter.value)
        && `${device.name} ${device.brand} ${device.detail}`.toLowerCase().includes(query));
      if (sortSelect.value === "price-low") matches.sort((a, b) => a.price - b.price);
      if (sortSelect.value === "price-high") matches.sort((a, b) => b.price - a.price);
      if (sortSelect.value === "name") matches.sort((a, b) => a.name.localeCompare(b.name));
      return matches;
    }
    function render() {
      const matches = getVisibleDevices();
      results.textContent = `${matches.length} ${matches.length === 1 ? "device" : "devices"} found`;
      if (!matches.length) {
        grid.innerHTML = '<p class="empty"><strong>No devices found</strong>Try another search or adjust your filters.</p>';
        return;
      }
      grid.replaceChildren(...matches.map(device => {
        const article = document.createElement("article");
        article.className = "card";
        const art = document.createElement("div");
        art.className = "art";
        art.style.setProperty("--art", device.art);
        art.style.setProperty("--light", device.colors[0]);
        art.style.setProperty("--dark", device.colors[1]);
        art.setAttribute("aria-hidden", "true");
        const illustration = document.createElement("div");
        illustration.className = `device${device.category === "tablet" ? " tablet" : ""}`;
        art.append(illustration);
        const content = document.createElement("div");
        content.className = "card-content";
        content.innerHTML = '<div class="meta"><span class="brand-name"></span><span class="stock">In stock</span></div><h3></h3><p class="spec"></p><div class="card-footer"><span class="price"></span><label class="check-label"><input class="device-checkbox" type="checkbox"><span>Select</span></label></div>';
        content.querySelector(".brand-name").textContent = device.brand;
        content.querySelector("h3").textContent = device.name;
        content.querySelector(".spec").textContent = device.detail;
        content.querySelector(".price").textContent = currency.format(device.price);
        const checkbox = content.querySelector(".device-checkbox");
        checkbox.value = device.id;
        checkbox.checked = selected.has(device.id);
        checkbox.setAttribute("aria-label", `Select ${device.name}`);
        article.append(art, content);
        return article;
      }));
    }
    function updateSelection() {
      const chosen = devices.filter(device => selected.has(device.id));
      countLabel.textContent = chosen.length ? `${chosen.length} ${chosen.length === 1 ? "device" : "devices"} selected` : "No devices selected";
      totalLabel.textContent = `Total: ${currency.format(chosen.reduce((sum, device) => sum + device.price, 0))}`;
      reviewButton.disabled = chosen.length === 0;
      clearButton.disabled = chosen.length === 0;
      render();
    }
    render();
    updateSelection();
  </script>
</body>
</html>
